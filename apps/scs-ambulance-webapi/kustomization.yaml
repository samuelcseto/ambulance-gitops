apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
    - "https://github.com/samuelcseto/ambulance-webapi//deployments/kustomize/install"
    - openapi-ui.service.yaml
    - http-route.yaml

patches:
    - path: patches/ambulance-webapi.deployment.yaml

labels:
    - pairs:
          app.kubernetes.io/component: scs-ambulance-webapi
          app.kubernetes.io/name: scs-ambulance-wl
          wac-fiit.github.io/component: backend
          wac-fiit.github.io/project: scs-ambulance-wl
