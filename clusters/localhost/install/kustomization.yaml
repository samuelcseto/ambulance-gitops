apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace:
    wac-hospital # chceme tieto objekty umiestniť do `wac-hospital` namespace
    # tento zapis preťaží hodnoty "namespace" vo všetkých objektoch
labels:
    - pairs:
          app.kubernetes.io/part-of: wac-hospital

resources:
    - ../../../apps/scs-ambulance-ufe
    - ../../../apps/scs-ambulance-webapi
    - ../../../apps/mongo-express
    - ../../../apps/http-echo

components:
    - ../../../components/version-developers
    - https://github.com/samuelcseto/ambulance-webapi//deployments/kustomize/components/mongodb

patches:
    - path: patches/ambulance-webapi.service.yaml
    - path: patches/mongodb-auth.secret.yaml
